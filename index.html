<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>한글 대탐험 (수사대 · 자음 탈출 · 단모음)</title>
<style>
:root{--bg:#f4f1ea;--ink:#2a2438;--sub:#6b6580;--line:#d9d3e6;--pri:#6c4fd6;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131b;--ink:#efecf7;--sub:#a9a3bd;--line:#38314a;--pri:#9b84ff;--card:#201c2b}}
:root[data-theme="dark"]{--bg:#14131b;--ink:#efecf7;--sub:#a9a3bd;--line:#38314a;--pri:#9b84ff;--card:#201c2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.step{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.step.on{background:var(--pri);border-color:var(--pri);color:#fff}.step:disabled{opacity:.55;cursor:default}
.skip{border:0;background:none;color:var(--sub);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer}
.ban{max-width:720px;margin:10px auto 0;padding:0 16px}
.ban div{background:var(--card);border:2px solid var(--pri);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.go{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
iframe{display:block;width:100%;border:0;min-height:640px}
</style></head><body>
<div class="top"><button class="step on" id="s0">① 단모음 탐험</button><button class="step" id="s1" disabled>② 한글 수사대 🔒</button><button class="step" id="s2" disabled>③ 자음 탈출 🔒</button><button class="skip" id="sk">전체 열기</button></div>
<div class="ban" id="ban" hidden><div><span id="bt"></span><button class="go" id="goBtn"></button></div></div>
<iframe id="f0" title="단모음 탐험대"></iframe><iframe id="f1" title="한글 수사대" hidden></iframe><iframe id="f2" title="자음 탈출 보드게임" hidden></iframe>
<script>
const P=["\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>단모음 탐험대 · 입 속 모양 찾기\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f8f3;--card:#fff;--ink:#23302a;--sub:#5f7068;--line:#d5e0d8;--pri:#2f8f5b;--ok:#2e9e5b;--bad:#d64f5f;--okbg:#e3f5ea;--badbg:#fbe8ea;--tg:#f08a9b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121915;--card:#1b2620;--ink:#e8f1ec;--sub:#9db1a6;--line:#2f4237;--pri:#4fc487;--ok:#5fcf8b;--bad:#ff7b8a;--okbg:#1d3326;--badbg:#3b2229}}\n:root[data-theme=\"dark\"]{--bg:#121915;--card:#1b2620;--ink:#e8f1ec;--sub:#9db1a6;--line:#2f4237;--pri:#4fc487;--ok:#5fcf8b;--bad:#ff7b8a;--okbg:#1d3326;--badbg:#3b2229}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Noto Sans KR\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;line-height:1.55}\n.wrap{max-width:640px;margin:0 auto;padding:16px}\nh1{font-size:1.4rem;margin:.2rem 0}h2{margin:.3rem 0}\n.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}\n.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}\n.chip{font-size:.78rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}\n.small{color:var(--sub);font-size:.85rem}\n.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.big{font-size:2.6rem;font-weight:800;color:var(--pri)}\n.tb{display:grid;grid-template-columns:.9fr repeat(4,1fr);gap:4px;margin:10px 0}\n.th{font-size:.72rem;color:var(--sub);text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.2;padding:2px}\n.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.4rem;font-weight:700;cursor:pointer;font-family:inherit;padding:0}\n.cell.right{border-color:var(--ok);background:var(--okbg)}.cell.wrong{border-color:var(--bad);background:var(--badbg)}.cell.pv{border-color:var(--pri)}\n.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}\n.opt{padding:14px 4px;font-size:1.5rem;font-weight:700;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}\n.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 18%,var(--card))}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt:disabled{opacity:.45}\n.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.92rem}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}\n#mo{text-align:center}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003ch1>👅 단모음 탐험대\u003c/h1>\n\u003cdiv class=\"small\">혀의 높이, 혀의 앞뒤 위치, 입술 모양으로 단모음 10개를 찾아라!\u003c/div>\n\u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\n\u003cdiv id=\"stage\">\u003c/div>\n\u003c/div>\n\u003cscript>\n// [모음, 혀 높이(0고 1중 2저), 앞뒤(0전설 1후설), 입술(0평순 1원순)]\nconst V=[[\"ㅣ\",0,0,0],[\"ㅔ\",1,0,0],[\"ㅐ\",2,0,0],[\"ㅟ\",0,0,1],[\"ㅚ\",1,0,1],[\"ㅡ\",0,1,0],[\"ㅓ\",1,1,0],[\"ㅏ\",2,1,0],[\"ㅜ\",0,1,1],[\"ㅗ\",1,1,1]];\nconst H=[\"고모음\",\"중모음\",\"저모음\"],B=[\"전설\",\"후설\"],L=[\"평순\",\"원순\"];\nconst $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);\nlet st=0,qi=0,Q=[],tr=0,lock=false,sel=null,pts=0,miss=0,put=0,BEST=0;\nconst nm=v=>`${H[v[1]]} · ${B[v[2]]} · ${L[v[3]]}`;\nconst txt=v=>`혀의 최고점이 ${[\"높고\",\"중간 높이이고\",\"낮고\"][v[1]]}, ${[\"혀의 앞쪽에서\",\"혀의 뒤쪽에서\"][v[2]]} 소리 나며, ${[\"입술은 평평하게 펴요\",\"입술은 둥글게 오므려요\"][v[3]]}.`;\nfunction mouth(h,b,l){const px=[70,125][b],py=[40,60,80][h],pr=l?9:0,g=l?10:26;\n return `\u003csvg viewBox=\"0 0 180 130\" width=\"100%\" style=\"max-width:280px\" role=\"img\" aria-label=\"입 속 단면도\">\u003cpath d=\"M24 20Q90 6 160 24L160 118L24 118Z\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"3\"/>\u003cpath d=\"M22 112C${px-45} 112 ${px-30} ${py} ${px} ${py}C${px+30} ${py} ${px+45} 112 160 112Z\" fill=\"var(--tg)\" opacity=\".85\"/>\u003ccircle cx=\"${px}\" cy=\"${py}\" r=\"5\" fill=\"var(--pri)\" stroke=\"var(--card)\" stroke-width=\"2\"/>\u003ctext x=\"${px}\" y=\"${py-9}\" font-size=\"9\" fill=\"var(--ink)\" text-anchor=\"middle\">최고점\u003c/text>\u003crect x=\"${4-pr}\" y=\"${58-g/2-14}\" width=\"20\" height=\"14\" rx=\"7\" fill=\"#e86f86\"/>\u003crect x=\"${4-pr}\" y=\"${58+g/2}\" width=\"20\" height=\"14\" rx=\"7\" fill=\"#e86f86\"/>\u003ctext x=\"8\" y=\"127\" font-size=\"9\" fill=\"var(--sub)\">앞(전설)\u003c/text>\u003ctext x=\"172\" y=\"127\" font-size=\"9\" fill=\"var(--sub)\" text-anchor=\"end\">뒤(후설)\u003c/text>\u003c/svg>`}\nfunction tbl(){let h=`\u003cdiv class=\"tb\">\u003cdiv>\u003c/div>`+B.flatMap(b=>L.map(l=>`\u003cdiv class=\"th\">${b}\u003cbr>${l}\u003c/div>`)).join(\"\");\n for(let r=0;r\u003c3;r++){h+=`\u003cdiv class=\"th\">${H[r]}\u003c/div>`;for(let c=0;c\u003c4;c++)h+=`\u003cbutton class=\"cell\" data-k=\"${r}${c>>1}${c&1}\" onclick=\"cell(${r},${c>>1},${c&1},this)\">\u003c/button>`}return h+`\u003c/div>`}\nfunction bar(){$(\"#bar\").innerHTML=[[\"① 혀 위치 찾기\",1],[\"② 설명 퍼즐\",2],[\"③ 체계표 완성\",3]].map(([t,n])=>`\u003cspan class=\"chip ${st===n?\"on\":\"\"}\">${t}\u003c/span>`).join(\"\")+`\u003cspan class=\"chip\">⭐ ${pts}점\u003c/span>`}\nlet ac;function beep(f,d=.12,t=\"sine\"){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}\nconst good=()=>{beep(660,.1);setTimeout(()=>beep(880,.15),90)},bad=()=>beep(180,.25,\"sawtooth\");\nfunction fb(m,c){$(\"#fb\").innerHTML=`\u003cdiv class=\"fb ${c}\">${m}\u003c/div>`}\nfunction intro(){st=0;pts=0;miss=0;bar();$(\"#stage\").innerHTML=`\u003cdiv class=\"card\">\u003ch2>🎤 소리의 비밀 3가지\u003c/h2>\u003cp>모음은 입 안에서 공기가 막히지 않고 나오는 소리예요. 단모음은 아래 세 가지 기준으로 나눕니다.\u003c/p>\u003cp>① \u003cb>혀의 최고점 높이\u003c/b>: 고모음, 중모음, 저모음\u003cbr>② \u003cb>혀의 앞뒤 위치\u003c/b>: 전설모음, 후설모음\u003cbr>③ \u003cb>입술 모양\u003c/b>: 평순모음, 원순모음\u003c/p>\u003cdiv id=\"mo\">${mouth(1,1,0)}\u003c/div>\u003cp class=\"small\">⭐ 입술은 앞쪽(왼쪽)에 있어요. 혀의 가장 높은 곳이 최고점이에요.\u003c/p>\u003cbutton class=\"btn\" onclick=\"s1()\">탐험 시작 ▶\u003c/button>\u003c/div>`}\nfunction s1(){st=1;qi=0;Q=sh(V).slice(0,6);ask()}\nfunction ask(){bar();tr=0;lock=false;const v=Q[qi];\n if(st===1)$(\"#stage\").innerHTML=`\u003cdiv class=\"card\">\u003cspan class=\"chip on\">① ${qi+1}/6\u003c/span>\u003cp>이 모음을 소리 낼 때의 위치를 표에서 찾으세요.\u003c/p>\u003cdiv style=\"text-align:center\" class=\"big\">${v[0]}\u003c/div>\u003cdiv id=\"mo\">${mouth(1,0,0)}\u003c/div>${tbl()}\u003cdiv id=\"fb\">\u003c/div>\u003c/div>`;\n else{const o=sh([v,...sh(V.filter(x=>x!==v)).slice(0,3)]);$(\"#stage\").innerHTML=`\u003cdiv class=\"card\">\u003cspan class=\"chip on\">② ${qi+1}/6\u003c/span>\u003cp>${txt(v)}\u003cbr>이 설명에 맞는 모음은?\u003c/p>\u003cdiv class=\"opts\">${o.map(x=>`\u003cbutton class=\"opt\" data-v=\"${x[0]}\" onclick=\"pick(this)\">${x[0]}\u003c/button>`).join(\"\")}\u003c/div>\u003cdiv id=\"fb\">\u003c/div>\u003c/div>`}}\nfunction done(first){lock=true;const nx=qi+1\u003cQ.length;$(\"#fb\").insertAdjacentHTML(\"beforeend\",`\u003cbutton class=\"btn\" onclick=\"qi++;${nx?\"ask()\":\"st===1?s2():s3()\"}\">${nx?\"다음 문제 ▶\":st===1?\"② 설명 퍼즐로 ▶\":\"③ 체계표 완성으로 ▶\"}\u003c/button>`)}\nfunction s2(){st=2;qi=0;Q=sh(V).slice(0,6);ask()}\nfunction award(first){if(first)pts+=10;else pts+=5;bar()}\nfunction pick(b){if(lock)return;const v=Q[qi];\n if(b.dataset.v===v[0]){b.classList.add(\"right\");good();award(tr===0);fb(`✅ ${v[0]}: ${nm(v)}`,\"ok\");document.querySelectorAll(\".opt\").forEach(x=>x.disabled=true);done()}\n else{tr++;miss++;b.classList.add(\"wrong\");b.disabled=true;bad();if(tr>=2){const a=[...document.querySelectorAll(\".opt\")].find(x=>x.dataset.v===v[0]);a.classList.add(\"right\");fb(`정답은 ${v[0]}이에요. ${nm(v)}`,\"no\");document.querySelectorAll(\".opt\").forEach(x=>x.disabled=true);done()}else fb(\"다시 생각해 보세요. 높이, 앞뒤, 입술 순서로 확인해요.\",\"no\")}}\nfunction cell(r,b,l,el){$(\"#mo\").innerHTML=mouth(r,b,l);\n if(st===1){if(lock||el.disabled)return;const v=Q[qi];\n  if(r===v[1]&&b===v[2]&&l===v[3]){el.classList.add(\"right\");el.textContent=v[0];good();award(tr===0);fb(`✅ ${v[0]}: ${nm(v)}`,\"ok\");done()}\n  else{tr++;miss++;el.classList.add(\"wrong\");el.disabled=true;bad();if(tr>=2){const a=document.querySelector(`.cell[data-k=\"${v[1]}${v[2]}${v[3]}\"]`);a.classList.add(\"right\");a.textContent=v[0];fb(`정답은 이 칸이에요. ${v[0]}: ${nm(v)}`,\"no\");done()}else fb(`${H[r]} · ${B[b]} · ${L[l]} 모양이에요. 다시 찾아보세요.`,\"no\")}}\n else if(st===3){if(!sel||el.textContent)return;const v=V.find(x=>x[0]===sel);\n  if(r===v[1]&&b===v[2]&&l===v[3]){el.textContent=v[0];el.classList.add(\"right\");el.disabled=true;document.querySelector(`.opt[data-v=\"${v[0]}\"]`).remove();sel=null;pts+=5;put++;good();bar();fb(`✅ ${v[0]} 자리 완성!`,\"ok\");if(put===10)fin()}\n  else{miss++;el.classList.add(\"wrong\");setTimeout(()=>el.classList.remove(\"wrong\"),500);bad();fb(`${sel}은(는) 여기가 아니에요. 높이, 앞뒤, 입술을 다시 확인해요.`,\"no\")}}}\nfunction s3(){st=3;put=0;sel=null;bar();$(\"#stage\").innerHTML=`\u003cdiv class=\"card\">\u003cspan class=\"chip on\">③ 체계표 완성\u003c/span>\u003cp>모음을 고른 뒤, 알맞은 칸을 눌러 표를 완성하세요. (칸을 누르면 입 속 모양도 보여요)\u003c/p>\u003cdiv class=\"opts\" style=\"grid-template-columns:repeat(5,1fr)\">${sh(V).map(x=>`\u003cbutton class=\"opt\" data-v=\"${x[0]}\" onclick=\"sel=this.dataset.v;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')\">${x[0]}\u003c/button>`).join(\"\")}\u003c/div>\u003cdiv id=\"mo\">${mouth(1,0,0)}\u003c/div>${tbl()}\u003cdiv id=\"fb\">\u003c/div>\u003c/div>`}\nfunction fin(){pts+=20;try{parent.postMessage({done:1,score:pts},\"*\")}catch(e){}try{BEST=+localStorage.getItem(\"vg_best\")||0;if(pts>BEST){BEST=pts;localStorage.setItem(\"vg_best\",BEST)}}catch(e){BEST=Math.max(BEST,pts)}bar();good();\n $(\"#fb\").insertAdjacentHTML(\"beforeend\",`\u003cdiv class=\"fb ok\">\u003cb>🎉 체계표 완성! 최종 ${pts}점\u003c/b> (완성 보너스 +20 포함)\u003cbr>실수 ${miss}번 · 내 최고 기록 ${BEST}점\u003cbr>\u003cbr>전설: ㅣ ㅔ ㅐ (평순), ㅟ ㅚ (원순)\u003cbr>후설: ㅡ ㅓ ㅏ (평순), ㅜ ㅗ (원순)\u003cbr>고모음 ㅣ ㅟ ㅡ ㅜ · 중모음 ㅔ ㅚ ㅓ ㅗ · 저모음 ㅐ ㅏ\u003c/div>\u003cbutton class=\"btn\" onclick=\"intro()\">다시 도전 ↺\u003c/button>`)}\nintro();\n\u003c/script>\n\u003cscript>try{new ResizeObserver(function(){parent.postMessage({h:Math.ceil(document.body.getBoundingClientRect().height)+8},\"*\")}).observe(document.body)}catch(e){}\u003c/script>\u003c/body>\n\u003c/html>\n","\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>한글 수사대 — 사라진 자음의 암호\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2430;--mute:#5d6675;--line:#cfd3da;--accent:#0d7a6b;--accent-ink:#fff;--warn:#c2410c;--ok:#15803d;--okbg:#e3f4e8;--badbg:#fdebdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10181f;--panel:#18232d;--ink:#e8eef2;--mute:#9aa8b4;--line:#2b3b48;--accent:#37c8b0;--accent-ink:#06211c;--warn:#fb923c;--ok:#4ade80;--okbg:#14301f;--badbg:#3a2412}}\n:root[data-theme=\"dark\"]{--bg:#10181f;--panel:#18232d;--ink:#e8eef2;--mute:#9aa8b4;--line:#2b3b48;--accent:#37c8b0;--accent-ink:#06211c;--warn:#fb923c;--ok:#4ade80;--okbg:#14301f;--badbg:#3a2412}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Noto Sans KR\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;line-height:1.6}\nmain{max-width:720px;margin:0 auto;padding:16px}\n.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--mute);margin-bottom:8px}\n.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}\n.fill{height:100%;background:var(--accent);transition:width .4s}\n.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:20px}\nh1{font-size:34px;margin:0 0 4px;letter-spacing:-1px}\nh2{font-size:20px;margin:0 0 6px}\n.sub{color:var(--mute);margin:0 0 16px}\n.alarm{border-left:6px solid var(--warn);padding:8px 12px;background:var(--badbg);margin:12px 0;animation:blink 1.4s steps(2) infinite}\n@keyframes blink{50%{border-left-color:transparent}}\n@media (prefers-reduced-motion:reduce){.alarm{animation:none}}\nbutton{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;min-height:44px}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\nbutton.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}\nbutton:disabled{opacity:.5;cursor:default}\n.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}\n.opts button{font-size:17px}\n.opts .right{background:var(--okbg);border-color:var(--ok)}\n.opts .wrong{background:var(--badbg);border-color:var(--warn)}\n.card{display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;font-size:56px;font-weight:700;border:3px dashed var(--accent);border-radius:12px;background:var(--panel);cursor:grab;user-select:none;touch-action:none;margin:6px 0}\n.zone{min-height:64px}\n.zone.over{border-style:dashed;border-color:var(--accent);background:var(--okbg)}\n.fb{min-height:52px;margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px}\n.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}\n.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}\n.stat{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}\n.stat b{font-size:26px;display:block}\n.badge{display:inline-block;border:2px solid var(--accent);border-radius:20px;padding:4px 14px;font-weight:700;color:var(--accent)}\nul.note{padding-left:18px;font-size:14px;color:var(--mute)}\n.mas{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mas svg{flex:none}.bub{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"bar\">\u003cspan id=\"lab\">한글 연구소\u003c/span>\u003cspan id=\"score\">0점\u003c/span>\u003c/div>\n\u003cdiv class=\"track\" aria-label=\"복구율\">\u003cdiv class=\"fill\" id=\"fill\" style=\"width:0%\">\u003c/div>\u003c/div>\n\u003cdiv class=\"mas\" id=\"mas\">\u003c/div>\n\u003cdiv id=\"app\">\u003c/div>\n\u003c/main>\n\u003cscript>\nconst C={\"ㄱ\":[\"연구개음\",\"파열음\"],\"ㅋ\":[\"연구개음\",\"파열음\"],\"ㄷ\":[\"치조음\",\"파열음\"],\"ㄹ\":[\"치조음\",\"유음\"],\"ㅅ\":[\"치조음\",\"마찰음\"],\"ㅈ\":[\"경구개음\",\"파찰음\"],\"ㅁ\":[\"양순음\",\"비음\"],\"ㅂ\":[\"양순음\",\"파열음\"],\"ㅎ\":[\"후음\",\"마찰음\"],\"ㄴ\":[\"치조음\",\"비음\"]};\nconst PH={양순음:\"두 입술이 만나는 위치를 떠올려 보세요.\",치조음:\"혀끝이 윗잇몸에 닿는 위치입니다.\",경구개음:\"혀가 단단한 입천장(센입천장)에 닿는 위치입니다.\",연구개음:\"혀의 뒷부분이 여린입천장에 닿는 위치입니다.\",후음:\"목청 사이에서 나는 소리입니다.\"};\nconst PL=[\"양순음\",\"치조음\",\"경구개음\",\"연구개음\",\"후음\"],ME=[\"파열음\",\"마찰음\",\"파찰음\",\"비음\",\"유음\"];\nconst LABS=[{n:\"제1 연구실 · 조음 위치 분석\",ok:\"연구실 복구 완료! 조음 위치 암호 조각을 얻었습니다.\"},{n:\"제2 연구실 · 조음 방법 분석\",ok:\"연구실 복구 완료! 조음 방법 암호 로 소리 나는 연구개 비음입니다.\"]].forEach(([p,a,o,e])=>S.push({lab:3,kind:\"choice\",prompt:p,opts:o,ans:a,hint:\"코로 공기가 나가며 혀 뒷부분이 올라가는 소리입니다.\",ex:e}));\n\nfunction say(m,t){const K=\"#3b2a1a\",E=m===\"happy\"?`\u003cpath d=\"M27 49q4-6 8 0M45 49q4-6 8 0\" fill=\"none\" stroke=\"${K}\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>`:`\u003ccircle cx=\"31\" cy=\"48\" r=\"3\" fill=\"${K}\"/>\u003ccircle cx=\"49\" cy=\"48\" r=\"3\" fill=\"${K}\"/>`,M={happy:\"M33 61q7 8 14 0\",sad:\"M34 67q6-6 12 0\",think:\"M35 64q5-2 10 1\"}[m]||\"M34 63h12\",X=m===\"sad\"?'\u003cpath d=\"M58 40q4 6 0 9q-4-3 0-9\" fill=\"#6cb4e8\"/>':m===\"think\"?`\u003ctext x=\"60\" y=\"38\" font-size=\"16\" font-weight=\"700\" fill=\"${K}\">?\u003c/text>`:\"\";document.getElementById(\"mas\").innerHTML=`\u003csvg viewBox=\"0 0 88 88\" width=\"80\" height=\"80\" role=\"img\" aria-label=\"수사견 자음이\">\u003cellipse cx=\"16\" cy=\"44\" rx=\"10\" ry=\"19\" fill=\"#a9703c\" stroke=\"${K}\" stroke-width=\"2\" transform=\"rotate(14 16 44)\"/>\u003cellipse cx=\"64\" cy=\"44\" rx=\"10\" ry=\"19\" fill=\"#a9703c\" stroke=\"${K}\" stroke-width=\"2\" transform=\"rotate(-14 64 44)\"/>\u003ccircle cx=\"40\" cy=\"48\" r=\"27\" fill=\"#f3d9b1\" stroke=\"${K}\" stroke-width=\"2\"/>\u003cellipse cx=\"40\" cy=\"61\" rx=\"13\" ry=\"10\" fill=\"#fff4e2\" stroke=\"${K}\" stroke-width=\"1.5\"/>\u003cellipse cx=\"40\" cy=\"55\" rx=\"5\" ry=\"3.5\" fill=\"${K}\"/>${E}\u003cpath d=\"${M}\" fill=\"none\" stroke=\"${K}\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>${X}\u003ccircle cx=\"68\" cy=\"68\" r=\"10\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003cpath d=\"M75 75l10 10\" stroke=\"var(--ink)\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003c/svg>\u003cdiv class=\"bub\" aria-live=\"polite\">${t}\u003c/div>`}\nfunction sh(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}\nfunction mix(){const o=[0,1,2,3].flatMap(l=>{const g=S.filter(s=>s.lab===l);return [l].n}\u003c/h2>\u003cp>\u003cb>${solved[l]} / ${t}\u003c/b> 문제 해결\u003c/p>\u003cdiv class=\"fb ok\">${LABS[l].ok}\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" onclick=\"${l===3?\"i=S.length;end()\":\"i=labIdx(\"+(l+1)+\")[0];show()\"}\">${l===3?\"결과 보기\":\"다음 연구실로\"}\u003c/button>\u003cbutton onclick=\"retry(${l})\">이 연구실 다시 도전\u003c/button>\u003c/div>\u003c/div>`}\nelse{app.innerHTML=`\u003cdiv class=\"panel\">\u003ch2>${LABS[l].n}\u003c/h2>\u003cp>\u003cb>${solved[l]} / ${t}\u003c/b> 문제 해결 — 복구하려면 ${need}문제 이상 해결해야 합니다.\u003c/p>\u003cdiv class=\"fb no\">연구실 잠금이 풀리지 않았습니다. 해설을 떠올리며 다시 도전하세요.\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" onclick=\"retry(${l})\">다시 도전\u003c/button>\u003c/div>\u003c/div>`}hud()}\nfunction retry(l){score=snap;solved[l]=0;wrongs=wrongs.filter(w=>w.lab!==l);i=labIdx(l)[0];show()}\nfunction end(){try{parent.postMessage({done:1,score:score},\"*\")}catch(e){}say(\"happy\",\"탈출 성공! 넌 최고의 수사관이야!\");const tot=S.length,sc=solved.reduce((a,b)=>a+b,0),pct=Math.round(sc/tot*100),b=pct===100&&first>=tot-2?\"수석 수사관\":pct>=80?\"우수 수사관\":\"신입 수사관\";hud();\napp.innerHTML=`\u003cdiv class=\"panel\">\u003ch1>탈출 성공!\u003c/h1>\u003cp class=\"sub\">자음 분류 데이터 복구 완료!\u003c/p>\u003cdiv class=\"stat\">\u003cdiv>\u003cb>${score}점\u003c/b>총점\u003c/div>\u003cdiv>\u003cb>${pct}%\u003c/b>정답률\u003c/div>\u003cdiv>\u003cb>${bonuses}회\u003c/b>연속 보너스\u003c/div>\u003c/div>\u003cp>획득 배지: \u003cspan class=\"badge\">${b}\u003c/span>\u003c/p>${wrongs.length?`\u003ch2>오답 노트\u003c/h2>\u003cul class=\"note\">${wrongs.map(w=>`\u003cli>${w.prompt} → \u003cb>${w.ans}\u003c/b>. ${w.ex}\u003c/li>`).join(\"\")}\u003c/ul>`:\"\u003cp>오답이 없습니다. 완벽한 수사였습니다!\u003c/p>\"}\u003cdiv class=\"row\">\u003cbutton class=\"primary\" onclick=\"start()\">처음부터 다시\u003c/button>\u003c/div>\u003c/div>`}\nstart();\n\u003c/script>\n\u003cscript>try{new ResizeObserver(function(){parent.postMessage({h:Math.ceil(document.body.getBoundingClientRect().height)+8},\"*\")}).observe(document.body)}catch(e){}\u003c/script>\u003c/body>\n\u003c/html>\n","\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>목소리 탈출 맵 · 자음 체계\u003c/title>\n\u003cstyle>\n:root{--bg:#fbf7ef;--card:#fff;--ink:#2a2438;--sub:#6b6580;--line:#e2dcec;--pri:#6c4fd6;--ok:#2e9e5b;--bad:#d64f5f;--okbg:#e6f6ec;--badbg:#fbe8ea;--yel:#f6c945;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#17141f;--card:#221e2d;--ink:#f0ecf8;--sub:#a9a3bd;--line:#38314a;--pri:#9b84ff;--ok:#5fcf8b;--bad:#ff7b8a;--okbg:#1d3326;--badbg:#3b2229}}\n:root[data-theme=\"dark\"]{--bg:#17141f;--card:#221e2d;--ink:#f0ecf8;--sub:#a9a3bd;--line:#38314a;--pri:#9b84ff;--ok:#5fcf8b;--bad:#ff7b8a;--okbg:#1d3326;--badbg:#3b2229}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Pretendard\",\"Noto Sans KR\",system-ui,sans-serif;line-height:1.55}\n.wrap{max-width:640px;margin:0 auto;padding:16px}\nh1{font-size:1.4rem;margin:.2rem 0}\n.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}\n.map{display:flex;align-items:center;justify-content:space-between;position:relative;padding:18px 8px 6px}\n.map:before{content:\"\";position:absolute;left:8%;right:8%;top:38px;height:4px;background:var(--line);border-radius:2px}\n.node{position:relative;text-align:center;font-size:.72rem;color:var(--sub);width:25%}\n.node b{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 4px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:1.2rem}\n.node.on b{border-color:var(--pri)}.node.done b{background:var(--ok);border-color:var(--ok);color:#fff}\n.hero{position:absolute;top:-4px;font-size:1.5rem;transition:left .6s}\n.hearts{font-size:1.1rem;letter-spacing:2px}\n.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.opt{padding:16px 6px;font-size:1.15rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}\n.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 15%,var(--card))}\n.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}\n.stones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.stone{border-radius:50%;aspect-ratio:1;font-size:1.6rem;font-weight:700}\n.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.92rem}\n.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}\n.small{color:var(--sub);font-size:.85rem}.tag{display:inline-block;background:var(--yel);color:#3a2d00;border-radius:8px;padding:1px 8px;font-size:.8rem;font-weight:700}\n.big{font-size:3rem;text-align:center}\n.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:2px 0 4px}\n.chip{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}\n.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}\n.dot{fill:var(--sub);stroke:var(--card);stroke-width:2}.dot.on{fill:var(--pri)}\n#hero{transition:transform .7s ease}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003ch1>🗝️ 목소리 탈출 맵\u003c/h1>\n\u003cdiv class=\"small\">조음 위치와 조음 방법으로 마왕의 성에서 목소리를 되찾자!\u003c/div>\n\u003cdiv class=\"card\" style=\"padding:10px 12px\">\n\u003csvg id=\"tract\" viewBox=\"0 0 270 190\" width=\"100%\" role=\"img\" aria-label=\"발음 기관 단면도: 입술에서 목청까지\" style=\"max-height:260px\">\n\u003cpath d=\"M130 18C80 18 58 40 56 66L42 84L56 94L54 112L50 122L56 130L52 142C60 168 90 178 130 178L260 178L260 18Z\" fill=\"var(--bg)\" stroke=\"var(--line)\" stroke-width=\"3\"/>\n\u003cpath d=\"M62 94Q110 84 175 100\" fill=\"none\" stroke=\"var(--line)\" stroke-dasharray=\"4 3\"/>\n\u003cpath d=\"M70 136Q100 122 130 126Q165 130 185 152L185 175L95 172Q75 162 70 136Z\" fill=\"#f08a9b\" opacity=\".75\"/>\n\u003cpath d=\"M60 121Q75 108 85 112Q120 92 160 104Q178 108 180 124\" fill=\"none\" stroke=\"var(--sub)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n\u003cpath d=\"M190 126V178M214 126V178\" stroke=\"var(--line)\" stroke-width=\"3\"/>\n\u003ctext x=\"232\" y=\"60\" font-size=\"11\" fill=\"var(--sub)\" text-anchor=\"middle\">코로 가는 길\u003c/text>\n\u003ctext x=\"110\" y=\"152\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">혀\u003c/text>\n\u003cg font-size=\"9\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">\n\u003ccircle class=\"dot\" cx=\"58\" cy=\"123\" r=\"8\"/>\u003ctext x=\"58\" y=\"126\">1\u003c/text>\n\u003ccircle class=\"dot\" cx=\"85\" cy=\"111\" r=\"8\"/>\u003ctext x=\"85\" y=\"114\">2\u003c/text>\n\u003ccircle class=\"dot\" cx=\"125\" cy=\"98\" r=\"8\"/>\u003ctext x=\"125\" y=\"101\">3\u003c/text>\n\u003ccircle class=\"dot\" cx=\"168\" cy=\"106\" r=\"8\"/>\u003ctext x=\"168\" y=\"109\">4\u003c/text>\n\u003ccircle class=\"dot\" cx=\"202\" cy=\"166\" r=\"8\"/>\u003ctext x=\"202\" y=\"169\">5\u003c/text>\u003c/g>\n\u003ctext id=\"hero\" x=\"0\" y=\"0\" font-size=\"22\" style=\"transform:translate(8px,116px)\">🧒\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n\u003cdiv class=\"small\" style=\"text-align:center\">🧒가 서 있는 곳이 지금 소리가 나는 위치예요.\u003c/div>\n\u003cdiv class=\"map\" id=\"map\">\u003c/div>\u003c/div>\n\u003cdiv id=\"sb\">\u003c/div>\u003cdiv id=\"stage\">\u003c/div>\n\u003c/div>\n\u003cscript>\nconst Z=[\n{ico:\"👄\",name:\"입술소리 성문\",rule:\"첫소리와 받
